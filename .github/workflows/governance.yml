name: Governance v3.2
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  checks: read
  issues: read
  pull-requests: read
jobs:
  governance:
    name: governance-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Policy checks
        run: python scripts/check_governance.py
      - name: Comprehensive v3 spec checks
        run: python scripts/verify_v3_kit.py
      - name: Comprehensive v3.2 spec checks
        run: python scripts/verify_v32_kit.py
      - name: Validate change records fixture
        run: python tools/changelog.py validate --records tests/fixtures/change_records.json --check-docs
      - name: Validate change record PR policy
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_changelog_pr.py
      - name: Deferred Designer interoperability policy (spec only)
        run: python scripts/check_design_interop_policy.py
      - name: Check controller source syntax
        run: python -m compileall -q tools scripts tests
      - name: Remote P00 observation (read-only; cannot merge)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          ZYNOA_GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.phase_worker --once --db "$RUNNER_TEMP/zynoa-controller-observation.db"
      - name: Guarded PR merge dry-run (must make no GitHub mutation)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          ZYNOA_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m tools.phase_merge_guard > "$RUNNER_TEMP/zynoa-merge-dryrun.json"
          exit_code=$?
          set -e
          python - "$RUNNER_TEMP/zynoa-merge-dryrun.json" "$exit_code" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          assert int(sys.argv[2]) in (0, 2)
          assert result["merge_performed"] is False
          assert result["status"] in ("BLOCKED", "ELIGIBLE_FOR_SEPARATELY_AUTHORIZED_MERGE")
          print("MERGE-GUARD DRY-RUN: PASS (zero GitHub mutations)")
          PY
      - name: Durable development queue smoke (read-only)
        run: |
          python -m tools.dev_job_runner --smoke --repo-root . --db "$RUNNER_TEMP/zynoa-job-smoke.db"
      - name: Trusted disposable worktree and file-scope regression
        run: python -m unittest tests.test_workspace_policy -v
      - name: Incident redaction tests
        run: python -m unittest discover -s tests -v
