name: P02 M26 final OPT-13 original PNG transfer
on:
  push:
    branches: ["phase/02-shared-ui"]
    paths:
      - ".github/workflows/p02-m26-final-opt13-export.yml"
permissions:
  contents: read
  actions: read
jobs:
  transfer-opt13:
    if: github.repository == 'Vertex-Systems-Network/zynoa-2-local' && github.ref == 'refs/heads/phase/02-shared-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: p01-desktop-windows-build-evidence
          run-id: 45569644620
          repository: Vertex-Systems-Network/zynoa-2-local
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/m26-final-opt13
      - name: Verify and transfer only the independently reviewed original PNG
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, struct
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"m26-final-opt13"/"docs/screenshots/_ci/M26/options"
          sha="7c0a4297693b3ef094beecf01f2271c54dff1ace"
          p=root/"M26-P02-OPT-13.png"
          proof=json.loads((root/"M26-options.capture.json").read_text(encoding="utf-8-sig"))
          verified=json.loads((root/"M26-options.verify.json").read_text(encoding="utf-8-sig"))
          m=json.loads(p.with_suffix(".capture.json").read_text(encoding="utf-8-sig"))
          assert proof["source_commit_sha"]==proof["built_commit_sha"]==sha
          assert proof["github_run_id"]=="45569644620" and proof["no_user_data"] is True
          assert verified["status"]=="M26_P02_20_OPTION_CANDIDATES_PASS" and verified["source_commit_sha"]==sha
          assert verified["options"]==verified["unique_native_images"]==20
          assert m["screenshot_id"]==p.stem and m["source_commit_sha"]==m["built_commit_sha"]==sha
          assert m["privacy"]=="Disposable CI fixture with no user content or secrets"
          assert m["capture_verified"] is False and m["window_fully_visible"] is True
          b=p.read_bytes()
          assert len(b)==56405 and b.startswith(b"\x89PNG\r\n\x1a\n")
          assert struct.unpack(">II",b[16:24])==(998,701)
          digest=hashlib.sha256(b).hexdigest()
          blob=hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          assert digest==m["sha256"]=="81905b27db8d4b9b1e1ab17afec7ddca41477714345f08eaeb1d1620fb72c73a"
          assert blob=="325124fdcbd0535a96c0641b08214fdfb1a6f761"
          enc=base64.b64encode(b).decode("ascii")
          print("M26_OPT13_BEGIN "+digest+" "+blob+" "+str(len(b)),flush=True)
          for i in range(0,len(enc),2400):
              print("M26_OPT13_CHUNK "+str(i//2400)+" "+enc[i:i+2400],flush=True)
          print("M26_OPT13_END "+str((len(enc)+2399)//2400),flush=True)
          PY
