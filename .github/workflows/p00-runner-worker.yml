# Phase-gated runner: P00 model-fixture execution remains isolated from the
# P01 read-only observer; no schedule or general code-edit permission.
name: P00 Runner Worker
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p00-runner-worker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The phase state and trusted Actions event jointly select one path.
  changes:
    runs-on: ubuntu-latest
    outputs:
      p00_fixture: ${{ steps.diff.outputs.p00_fixture }}
      phase_observer: ${{ steps.diff.outputs.phase_observer }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: diff
        env:
          BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          import subprocess
          from tools.phase_controller import runner_job_plan, PhasePolicyError, validate_snapshot

          event = os.environ["GITHUB_EVENT_NAME"]
          branch = os.environ.get("GITHUB_HEAD_REF") or os.environ.get("GITHUB_REF_NAME", "")
          base = os.environ.get("BASE", "")
          pr = os.environ.get("PR_NUMBER", "")
          if event == "workflow_dispatch":
              files = []
          elif subprocess.run(["git", "cat-file", "-e", base + "^{commit}"],
                              capture_output=True).returncode:
              # Unknown base schedules checks only, not new authority.
              files = [".github/workflows/p00-runner-worker.yml"]
          else:
              changed = subprocess.run(["git", "diff", "--name-only", "-z", base, "HEAD"],
                                       capture_output=True, check=True).stdout
              files = [s.decode("utf-8") for s in changed.split(b"\0") if s]
          state = json.loads(Path("docs/state/PHASE.json").read_text(encoding="utf-8"))
          # Closeout PRs propose a verified snapshot but must NEVER gain
          # worker/model or observer authority. Only the dedicated, correctly
          # phase-scoped postmerge closeout ref may report both jobs disabled.
          if state.get("phase_status") == "MERGED_VERIFIED":
              closeout_ok = (
                  not validate_snapshot(state)
                  and event == "pull_request"
                  and branch == f"phase/{state['phase'][1:].lower()}-closeout"
                  and pr.isdecimal()
                  and int(pr) != state.get("primary_pr")
                  and state.get("lease_holder") is None
                  and state.get("worker_running") is False
              )
              if not closeout_ok:
                  raise PhasePolicyError("untrusted verified-phase runner event")
              plan = {"p00_fixture": False, "phase_observer": False}
          else:
              plan = runner_job_plan(
                  state, files, event=event, head_branch=branch,
                  pr_number=int(pr) if pr and pr.isdecimal() else None,
              )
          for name, enabled in plan.items():
              print(f"{name}={'true' if enabled else 'false'}")
          PY
  # P01 observer has no Docker, Ollama, write token or code-edit grant.
  phase-observer:
    needs: changes
    if: needs.changes.outputs.phase_observer == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Observe active phase PR/CI (read-only, no merge)
        env:
          ZYNOA_GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.phase_worker --once --db "$RUNNER_TEMP/zynoa-p01-observation.db"
  worker:
    needs: changes
    if: needs.changes.outputs.p00_fixture == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ZYNOA_MODEL: qwen2.5-coder:7b
      ZYNOA_MODEL_TIMEOUT: '240'
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Rootless Docker (non-root runner user, cgroup v2 + systemd)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq uidmap dbus-user-session
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo mkdir -p /etc/systemd/system/user@.service.d
          printf '[Service]\nDelegate=cpu cpuset io memory pids\n' | sudo tee /etc/systemd/system/user@.service.d/delegate.conf
          sudo systemctl daemon-reload
          sudo systemctl disable --now docker.service docker.socket
          sudo loginctl enable-linger "$USER"
          sudo systemctl restart "user@$(id -u).service"
          export XDG_RUNTIME_DIR=/run/user/$(id -u) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus
          curl -fsSL https://get.docker.com/rootless | FORCE_ROOTLESS_INSTALL=1 sh
          systemctl --user is-active docker
          echo "PATH=$HOME/bin:$PATH" >> "$GITHUB_ENV"
          echo "ZYNOA_DOCKER=$HOME/bin/docker" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Pre-cache digest-pinned image (broker uses --pull never)
        run: docker pull "$(python -c 'from tools.docker_syntax_broker import DEFAULT_IMAGE as i;print(i)')" && docker info --format '{{.SecurityOptions}} {{.CgroupVersion}} {{.CgroupDriver}}'
      - name: Local Ollama with small model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          curl -sf http://127.0.0.1:11434/api/tags >/dev/null || (nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
          for i in $(seq 30); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:11434/api/tags >/dev/null || { cat "$RUNNER_TEMP/ollama.log"; exit 1; }
          ollama pull "$ZYNOA_MODEL"
          # Preload weights so the 45s planner transport timeout covers inference only.
          ollama run --keepalive 30m "$ZYNOA_MODEL" "ok" >/dev/null
      - name: P00-T15 local Ollama health preflight
        run: python -m tools.local_model_probe
      - name: Run AI worker (model draft -> rootless syntax -> rootless test -> repair)
        run: set -o pipefail; python -m scripts.runner_worker | tee worker-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: p00-worker-receipt, path: worker-receipt.json }
  # P00-T21: scoped write identity = this run's GITHUB_TOKEN. It may only push a
  # fresh bot/* branch; main stays guarded by ruleset #27593065 (no bypass).
  publish:
    needs: [changes, worker]
    if: needs.changes.outputs.p00_fixture == 'true' && needs.worker.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: p00-worker-receipt }
      - name: Push receipt to scoped bot branch and read it back
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bot/p00-worker-${{ github.run_id }}
        run: |
          set -euo pipefail
          git init -q w && cd w
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p evidence && cp ../worker-receipt.json evidence/
          git add evidence && git commit -qm "P00 worker receipt run ${{ github.run_id }}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/${BRANCH}"
          sha=$(git rev-parse HEAD)
          remote=$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "refs/heads/${BRANCH}" | cut -f1)
          test "$sha" = "$remote" && echo "T21 readback OK $BRANCH $sha"
          # Negative proof: the same token must NOT be able to update protected main.
          if git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/main" 2>/dev/null; then echo "main write NOT blocked"; exit 1; fi
          echo "T21 main protected OK"
