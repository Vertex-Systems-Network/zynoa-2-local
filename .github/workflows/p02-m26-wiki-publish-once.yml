name: P02 guarded publish Wiki preview M26 once
on:
  push:
    branches:
      - phase/02-shared-ui
    paths:
      - .github/workflows/p02-m26-wiki-publish-once.yml
permissions:
  contents: read
concurrency:
  group: p02-m26-wiki-once-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish-m26-only:
    if: github.repository == 'Vertex-Systems-Network/zynoa-2-local' && github.ref == 'refs/heads/phase/02-shared-ui'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish exactly one new preview page, no overwrite
        id: publish
        shell: bash
        env:
          GH_WIKI_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$REPO" = 'Vertex-Systems-Network/zynoa-2-local'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          wiki_url="https://github.com/$REPO.wiki.git"
          wiki_dir="$RUNNER_TEMP/p02-m26-wiki-guarded"
          export GIT_TERMINAL_PROMPT=0
          git -c credential.helper= clone --quiet --depth=1 "$wiki_url" "$wiki_dir"
          initial="$(git -C "$wiki_dir" rev-parse HEAD)"
          test "$initial" = '13b5a194a26320166b1f8dd5301a0d06c4098f93' || { echo 'ZYN-M26-WIKI-409: public Wiki changed since verified readback'; exit 1; }
          test ! -e "$wiki_dir/M26.md" || { echo 'ZYN-M26-WIKI-409: refuse overwrite of existing M26'; exit 1; }
          WIKI_DIR="$wiki_dir" python - <<'PY'
          import os,pathlib,re
          sha=os.environ["SOURCE_SHA"]
          repo=os.environ["REPO"]
          source=pathlib.Path("docs/wiki/pages/M26.md").read_text(encoding="utf-8")
          source=source.split("\n## P00 sanitized GitHub CI failure issue writer",1)[0]
          source=source.replace("**Draft source only. Not published to GitHub Wiki.**","**P02 source-bound preview, not a released product manual.**")
          source=re.sub(r'\]\(\.\./\.\./([^\s)]+)\)',lambda m: "](https://github.com/"+repo+"/blob/"+sha+"/docs/"+m.group(1)+")",source)
          banner=("> **P02 preview only — NOT a released product manual.** No signed release data, live issue inventory, "
                  "audit or recovery services are enabled. Native option, speech and final acceptance remain separate. "
                  "[Original source](https://github.com/"+repo+"/blob/"+sha+"/docs/wiki/pages/M26.md).\n\n")
          text=banner+source
          assert len(text)>3000 and "../../" not in text
          assert all(f"M26-OPT-{i:02d}" in text for i in range(1,21))
          assert "https://github.com/"+repo+"/blob/"+sha+"/docs/help/articles/M26.md" in text
          (pathlib.Path(os.environ["WIKI_DIR"])/"M26.md").write_text(text,encoding="utf-8")
          PY
          test "$(git -C "$wiki_dir" status --porcelain)" = '?? M26.md'
          git -C "$wiki_dir" config user.name 'github-actions[bot]'
          git -C "$wiki_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$wiki_dir" add -- M26.md
          git -C "$wiki_dir" commit --quiet -m 'docs(P02): add source-bound M26 preview only'
          test "$(git -C "$wiki_dir" diff-tree --no-commit-id --name-only -r HEAD)" = 'M26.md'
          branch="$(git -C "$wiki_dir" branch --show-current)"
          case "$branch" in main|master) ;; *) echo 'ZYN-M26-WIKI-409: unexpected Wiki branch'; exit 1;; esac
          auth="$(printf 'x-access-token:%s' "$GH_WIKI_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -C "$wiki_dir" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --porcelain origin "HEAD:refs/heads/$branch" >/dev/null || { echo 'ZYN-M26-WIKI-403: guarded Wiki push refused'; exit 1; }
          unset auth GH_WIKI_TOKEN
          reread="$RUNNER_TEMP/p02-m26-wiki-readback"
          git -c credential.helper= clone --quiet --depth=1 "$wiki_url" "$reread"
          SOURCE_TREE="$wiki_dir" READBACK_TREE="$reread" INIT_WIKI_SHA="$initial" python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          src=pathlib.Path(os.environ["SOURCE_TREE"])
          dst=pathlib.Path(os.environ["READBACK_TREE"])
          before=os.environ["INIT_WIKI_SHA"]
          head=subprocess.check_output(["git","rev-parse","HEAD"],cwd=dst,text=True).strip()
          assert head==subprocess.check_output(["git","rev-parse","HEAD"],cwd=src,text=True).strip()
          b=(src/"M26.md").read_bytes()
          assert b==(dst/"M26.md").read_bytes()
          assert subprocess.check_output(["git","diff-tree","--no-commit-id","--name-only","-r","HEAD"],cwd=src,text=True).strip()=="M26.md"
          report={"schema_version":1,"repository":os.environ["REPO"],"source_sha":os.environ["SOURCE_SHA"],"github_run_id":os.environ["RUN_ID"],
                  "wiki_head_before":before,"wiki_head_after":head,"page":"M26.md","sha256":hashlib.sha256(b).hexdigest(),
                  "published_preview_not_final_release":True,"fresh_unauthenticated_git_clone_readback":True,
                  "existing_pages_untouched":True,"full_module_release_approved":False}
          (pathlib.Path(os.environ["RUNNER_TEMP"])/"M26-wiki-publish-readback.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: p02-m26-wiki-published-readback
          path: ${{ runner.temp }}/M26-wiki-publish-readback.json
          if-no-files-found: error
          retention-days: 30
  verify-public-m26:
    needs: publish-m26-only
    if: github.repository == 'Vertex-Systems-Network/zynoa-2-local' && github.ref == 'refs/heads/phase/02-shared-ui'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: p02-m26-wiki-published-readback
          path: ${{ runner.temp }}/m26-wiki-proof
      - name: Verify actual public browser DOM and pinned source links
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python -m tools.verify_p02_t11_wiki_render --root . --source-sha "$SOURCE_SHA" --run-id "$RUN_ID" --m26-publish-receipt "$RUNNER_TEMP/m26-wiki-proof/M26-wiki-publish-readback.json" --report "$RUNNER_TEMP/M26-wiki-browser.verify.json"
      - uses: actions/upload-artifact@v6
        with:
          name: p02-m26-wiki-browser
          path: ${{ runner.temp }}/M26-wiki-browser.verify.json
          if-no-files-found: error
          retention-days: 30
