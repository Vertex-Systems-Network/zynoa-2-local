name: Verified Phase Transition Receipt

on:
  push:
    branches: [main]
    paths:
      - docs/state/PHASE.json
      - tools/phase_transition_publisher.py
      - tools/github_gateway.py
      - tools/phase_controller.py
      - .github/workflows/verified-phase-transition.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: zynoa-verified-phase-transition-main
  cancel-in-progress: true

jobs:
  receipt:
    # This privileged job is NEVER run for pull_request / untrusted branches.
    if: github.ref == 'refs/heads/main' && github.repository == 'Vertex-Systems-Network/zynoa-2-local'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout exact trusted default-branch commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check canonical postmerge phase status
        id: phase_gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          state = json.loads(Path("docs/state/PHASE.json").read_text(encoding="utf-8"))
          if not isinstance(state, dict):
              raise SystemExit("invalid phase JSON object")
          status = state.get("phase_status")
          if status not in ("IN_PROGRESS", "MERGED_VERIFIED"):
              raise SystemExit("invalid phase status")
          ready = state.get("phase") != "P00" and status == "MERGED_VERIFIED"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("ready=" + ("true" if ready else "false") + "\n")
          if not ready:
              print("Transition receipt SKIPPED: canonical phase not yet merged-verified")
          PY
      - name: Verify postmerge P01+ transition and persist bot PR receipt
        if: steps.phase_gate.outputs.ready == 'true'
        env:
          ZYNOA_GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.phase_transition_publisher --publish
