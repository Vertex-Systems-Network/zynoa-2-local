name: P02 guarded publish Wiki preview M02 M19
on:
  push:
    branches:
      - phase/02-shared-ui
    paths:
      - .github/workflows/p02-wiki-publish-once.yml
permissions:
  contents: write
concurrency:
  group: p02-publish-wiki-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish-two-new-pages-only:
    if: github.repository == 'Vertex-Systems-Network/zynoa-2-local' && github.ref == 'refs/heads/phase/02-shared-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Guard origin and publish only new preview pages with readback
        shell: bash
        env:
          GH_WIKI_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$REPO" = 'Vertex-Systems-Network/zynoa-2-local'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -s docs/wiki/pages/M02.md
          test -s docs/wiki/pages/M19.md
          wiki_url="https://github.com/${REPO}.wiki.git"
          wiki_dir="$RUNNER_TEMP/p02-wiki-guarded"
          export GIT_TERMINAL_PROMPT=0
          git -c credential.helper= clone --quiet --depth=1 "$wiki_url" "$wiki_dir"
          initial="$(git -C "$wiki_dir" rev-parse HEAD)"
          test "$initial" = 'cd5bbe1a804aa5775ca1acfc6db78afb14379306' || { echo 'P02-WIKI-409: remote Wiki changed since independent read-only review'; exit 1; }
          test ! -e "$wiki_dir/M02.md" && test ! -e "$wiki_dir/M19.md" || { echo 'P02-WIKI-409: destination exists; refuse overwrite'; exit 1; }
          WIKI_DIR="$wiki_dir" python - <<'PY'
          import hashlib,json,os,pathlib,re
          repo=os.environ["REPO"]; sha=os.environ["SOURCE_SHA"]
          root=pathlib.Path(os.environ["WIKI_DIR"])
          for module in ("M02","M19"):
              source=pathlib.Path("docs/wiki/pages")/(module+".md")
              text=source.read_text(encoding="utf-8")
              # GitHub Wiki is a separate repository; source-relative links are
              # rewritten to SHA-pinned main-repo files, preserving fragments.
              text=re.sub(r'\]\(\.\./\.\./([^\s)]+)\)',lambda m: '](https://github.com/'+repo+'/blob/'+sha+'/'+m.group(1)+')',text)
              text=text.replace("The remote GitHub Wiki repository has **not** been synced or verified.", "This page is a P02 preview published from a source-controlled commit.")
              text=text.replace("Source-controlled Markdown, **not published** as a remote GitHub Wiki.", "GitHub Wiki P02 source-bound preview, not a released module.")
              banner=('> **P02 preview only — NOT a released product manual.** '
                      'This GitHub Wiki copy is a SHA-pinned source snapshot; '
                      'full NVDA/Narrator, performance, release and protected PR '
                      'acceptance remain open. [Original source](https://github.com/'
                      +repo+'/blob/'+sha+'/docs/wiki/pages/'+module+'.md).\n\n')
              rendered=banner+text
              assert len(rendered)>3000 and 'docs/help/articles' in rendered
              assert 'https://github.com/'+repo+'/blob/'+sha+'/' in rendered
              assert '../../' not in rendered, "Unrewritten cross-repository link"
              (root/(module+'.md')).write_text(rendered,encoding="utf-8")
          print('P02-WIKI: Rendered only M02/M19 SHA-pinned preview Markdown, no Home page changes')
          PY
          test "$(git -C "$wiki_dir" status --porcelain | wc -l | tr -d ' ')" = 2 || { echo 'P02-WIKI-409: unexpected wiki changes'; exit 1; }
          git -C "$wiki_dir" config user.name 'github-actions[bot]'
          git -C "$wiki_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$wiki_dir" add -- M02.md M19.md
          git -C "$wiki_dir" commit -m "docs(P02): add source-bound M02 and M19 preview pages" --quiet
          branch="$(git -C "$wiki_dir" branch --show-current)"
          case "$branch" in main|master) ;; *) echo 'P02-WIKI-409: unknown wiki branch'; exit 1;; esac
          auth="$(printf 'x-access-token:%s' "$GH_WIKI_TOKEN" | base64 -w0)"
          git -C "$wiki_dir" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --porcelain origin "HEAD:refs/heads/$branch" >/dev/null || { echo 'P02-WIKI-403: GitHub Wiki remote denied built-in GITHUB_TOKEN; no publication claimed'; exit 1; }
          unset auth
          reread="$RUNNER_TEMP/p02-wiki-independent-readback"
          git -c credential.helper= clone --quiet --depth=1 "$wiki_url" "$reread"
          SOURCE_TREE="$wiki_dir" READBACK_TREE="$reread" INIT_WIKI_SHA="$initial" python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          src=pathlib.Path(os.environ["SOURCE_TREE"]); dst=pathlib.Path(os.environ["READBACK_TREE"])
          pages={}
          for name in ("M02.md","M19.md"):
              b=(src/name).read_bytes(); actual=(dst/name).read_bytes()
              assert b==actual and len(actual)>3000, "Independent remote wiki page readback mismatch"
              pages[name]=hashlib.sha256(b).hexdigest()
          head=subprocess.check_output(["git","rev-parse","HEAD"],cwd=dst,text=True).strip()
          assert head==subprocess.check_output(["git","rev-parse","HEAD"],cwd=src,text=True).strip()
          report={"schema_version":1,"source_sha":os.environ["SOURCE_SHA"],"source_repo":os.environ["REPO"],"wiki_head_before":os.environ["INIT_WIKI_SHA"],"wiki_head_after":head,"pages_published_verified":2,"pages_sha256":pages,"hosted_wiki_published_verified":True,"scope":"SOURCE_BOUND_PREVIEW_PAGES_ONLY","full_module_release_approved":False,"no_overwrite_of_existing_home":True,"remote_readback":True}
          (pathlib.Path(os.environ["RUNNER_TEMP"])/"p02-wiki-publish-readback.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,sort_keys=True))
          PY
      - name: Preserve verified Wiki publish readback only on full success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p02-wiki-published-readback
          path: ${{ runner.temp }}/p02-wiki-publish-readback.json
          retention-days: 30
