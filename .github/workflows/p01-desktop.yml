name: P01 Desktop Foundation
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: p01-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.diff.outputs.desktop }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        env:
          PR_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Always verify the complete PR delta, not merely HEAD^..HEAD:
          # docs-only handoff commits must never suppress required Windows gates.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only FETCH_HEAD HEAD)"
          test -n "$changed" || { echo "::error::Unexpected empty PR diff"; exit 1; }
          if printf '%s\n' "$changed" | grep -qE '^(scripts/capture_p01_desktop\.ps1|scripts/probe_p02_native_a11y\.ps1|scripts/probe_p02_native_performance\.ps1|apps/desktop/|tests/test_p01_desktop_shell.py|tests/test_p01_ipc_contract.py|tests/test_p01_native_security.py|tests/test_p01_diagnostics.py|tests/test_p01_vault.py|tests/test_p01_locations.py|tests/test_p01_events.py|tests/test_p01_screenshot_capture.py|tests/test_p02_ui_contract.py|tests/test_p02_t03_navigation.py|tests/test_p02_m19_workflows.py|tests/test_p02_m02_controls.py|tests/test_p02_native_evidence.py|tests/test_p02_t12_change_center.py|tools/verify_p02_m26_candidates.py|tests/test_p02_native_uia.py|tests/test_p02_native_performance.py|tools/verify_p02_native_performance.py|tests/test_p02_t10_performance_budget.py|tools/verify_p02_t10_performance_budget.py|docs/quality/P02_T10_PERFORMANCE_BUDGET.json|tests/test_p02_nvda_speech.py|tools/verify_p02_nvda_speech.py|scripts/probe_p02_nvda_speech.ps1|scripts/nvda/zynoaAudit.py|tests/test_p02_visual_review_pack.py|tools/build_p02_visual_review_pack.py|tests/test_p02_staged_native_assets.py|tools/stage_p02_native_assets.py|tests/test_p02_help_evidence.py|tests/test_p02_t02_acceptance.py|tools/verify_p02_native_evidence.py|tools/verify_p02_native_uia.py|tools/verify_p02_t02_acceptance.py|docs/screenshots/MANIFEST.json|docs/modules/M02.md|docs/evidence/P02_T03_ACCEPTANCE.md|docs/help/articles/M02.md|docs/help/articles/M19.md|docs/wiki/pages/M02.md|docs/wiki/pages/M19.md|docs/modules/M19.md|\.github/workflows/p01-desktop.yml)'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  desktop-windows:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'phase/01-foundation' || github.event.pull_request.head.ref == 'phase/02-shared-ui')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with: { node-version: '22', package-manager-cache: false }
      - name: Desktop shell and IPC safety contracts
        run: python -m unittest tests.test_p01_desktop_shell tests.test_p01_ipc_contract tests.test_p01_native_security tests.test_p01_diagnostics tests.test_p01_vault tests.test_p01_locations tests.test_p01_events tests.test_p01_screenshot_capture -v
      - name: P02 M02 comprehensive session preferences and state contracts
        if: github.event.pull_request.head.ref == 'phase/02-shared-ui'
        run: python -m unittest tests.test_p02_m02_controls -v
      - name: P02 keyboard focus and accessibility contracts
        if: github.event.pull_request.head.ref == 'phase/02-shared-ui'
        run: python -m unittest tests.test_p02_ui_contract -v
      - name: P02-T03 adaptive rail and named-pane source contracts
        if: github.event.pull_request.head.ref == 'phase/02-shared-ui'
        run: python -m unittest tests.test_p02_t03_navigation -v
      - name: P02 M19 functional offline Help contracts
        if: github.event.pull_request.head.ref == 'phase/02-shared-ui'
        run: python -m unittest tests.test_p02_m19_workflows -v
      - name: P02-T12 Change Center and M26 candidate verifier contracts
        if: github.event.pull_request.head.ref == 'phase/02-shared-ui'
        run: python -m unittest tests.test_p02_t12_change_center -v
      - name: P02 fail-closed native screenshot verifier contracts
        if: github.event.pull_request.head.ref == 'phase/02-shared-ui'
        shell: pwsh
        run: |
          python -m unittest tests.test_p02_native_evidence -v
          if ($LASTEXITCODE -ne 0) { throw 'P02 native provenance verifier contract failure' }
          python -m unittest tests.test_p02_t11_narrator -v
          if ($LASTEXITCODE -ne 0) { throw 'P02 Narrator proof contract failed' }
          python -m unittest tests.test_p02_t11_security_privacy -v
          if ($LASTEXITCODE -ne 0) { throw 'P02 T11 security/privacy negative regression tests failed' }
          python -m tools.verify_p02_t11_security_privacy --root . --report docs/screenshots/_ci/M02/P02-T11-source-security.verify.json
          if ($LASTEXITCODE -ne 0) { throw 'P02 T11 source security/privacy gate failed' }
          python -m unittest tests.test_p02_t10_acceptance -v
          if ($LASTEXITCODE -ne 0) { throw 'P02 T10 original screenshot/Wiki/live-proof acceptance contract failure' }
          python -m unittest tests.test_p02_t10_readiness -v
          if ($LASTEXITCODE -ne 0) { throw 'P02 T10 readiness contract failure' }
          python -m unittest tests.test_p02_visual_review_pack -v
          if ($LASTEXITCODE -ne 0) { throw 'P02 native visual review pack contracts failure' }
          python -m unittest tests.test_p02_staged_native_assets -v
          if ($LASTEXITCODE -ne 0) { throw 'P02 actual source-bound screenshot ZIP staging contracts failure' }
          python -m unittest tests.test_p02_nvda_speech -v
          if ($LASTEXITCODE -ne 0) { throw 'P02 NVDA speech proof negative tests failed' }
          python -m unittest tests.test_p02_t10_performance_budget -v
          if ($LASTEXITCODE -ne 0) { throw 'P02 preview native performance budget regression failed' }
          python -m unittest tests.test_p02_native_performance -v
          if ($LASTEXITCODE -ne 0) { throw 'P02 repeated native performance proof contracts failed' }
      - name: P02 native Windows UI Automation source and negative contracts
        if: github.event.pull_request.head.ref == 'phase/02-shared-ui'
        run: python -m unittest tests.test_p02_native_uia -v
      - name: P02 truthful Help and Wiki contracts
        if: github.event.pull_request.head.ref == 'phase/02-shared-ui'
        run: python -m unittest tests.test_p02_help_evidence -v
      - name: P02-T02 final acceptance guard (no premature DONE)
        if: github.event.pull_request.head.ref == 'phase/02-shared-ui'
        shell: pwsh
        run: |
          python -m unittest tests.test_p02_t02_acceptance -v
          if ($LASTEXITCODE -ne 0) { throw "P02-T02 Python acceptance tests failed" }
          python -m tools.verify_p02_t02_acceptance --report docs/screenshots/_ci/M02/P02-T02-12-readiness.json
          if ($LASTEXITCODE -ne 0) { throw "P02-T02 native evidence audit failed" }
      - name: Parse screenshot capture script (fail fast)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\capture_p01_desktop.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            throw ('ZYN-SCREEN-PARSE: ' + ($parseErrors | ForEach-Object { $_.Message } | Out-String))
          }
          $uiaScript = Join-Path $env:GITHUB_WORKSPACE 'scripts\probe_p02_native_a11y.ps1'
          $uiaErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($uiaScript, [ref]$tokens, [ref]$uiaErrors)
          if ($uiaErrors.Count -gt 0) {
            throw ('ZYN-A11Y-PARSE: ' + ($uiaErrors | ForEach-Object { $_.Message } | Out-String))
          }
          $perfTokens = $null
          $perfErrors = $null
          $perfScript = Join-Path $env:GITHUB_WORKSPACE 'scripts\probe_p02_native_performance.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile($perfScript, [ref]$perfTokens, [ref]$perfErrors)
          if ($perfErrors.Count -gt 0) {
            throw ('ZYN-PERF-PARSE: ' + ($perfErrors | ForEach-Object { $_.Message } | Out-String))
          }
      - name: Resolve pinned dependency inventory
        working-directory: apps/desktop
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install verified lockfile dependencies
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund
      - name: Frontend TypeScript check
        working-directory: apps/desktop
        run: npm run check
      - name: Frontend UI algorithm tests
        working-directory: apps/desktop
        run: npm run test:ui
      - name: Frontend offline production bundle
        working-directory: apps/desktop
        run: npm run build
      - name: Native IPC validation tests (no user data)
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib --release
      - name: Native Windows desktop build (no release or signature)
        id: native_build
        working-directory: apps/desktop
        run: npm run tauri -- build --no-bundle
      - name: Verify desktop executable cold boot
        shell: pwsh
        env:
          ZYNOA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ZYNOA_CAPTURE_P02: ${{ github.event.pull_request.head.ref == 'phase/02-shared-ui' && '1' || '0' }}
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\src-tauri\target\release\zynoa_desktop.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Desktop binary not built' }
          $builtSha = (& git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim().ToLowerInvariant()
          if ($builtSha -ne $env:ZYNOA_HEAD_SHA.ToLowerInvariant()) {
            throw 'ZYN-SCREEN-014: checked-out built commit does not match PR source SHA'
          }
          $metadataRoot = Join-Path $env:LOCALAPPDATA 'com.zynoa.desktop'
          $metadataPaths = [ordered]@{diagnostics=(Join-Path $metadataRoot 'diagnostics\events-v1.jsonl');vault=(Join-Path $metadataRoot 'data\state.sqlite');registry=(Join-Path $metadataRoot 'storage-locations-v1.json')}
          $metadataPreexisting = [ordered]@{}
          $firstObserved = [ordered]@{}
          foreach ($key in $metadataPaths.Keys) {
            $metadataPreexisting[$key] = [bool](Test-Path -LiteralPath $metadataPaths[$key])
            $firstObserved[$key] = $null
          }
          $nativeTiming = [System.Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process -FilePath $exe -PassThru
          $processReturnMs = [int64]$nativeTiming.ElapsedMilliseconds
          try {
            # Process existence alone is not native initialization readiness.
            # Keep the executable alive until all three OS-local foundations exist.
            $root = Join-Path $env:LOCALAPPDATA 'com.zynoa.desktop'
            $diagnostics = Join-Path $root 'diagnostics\events-v1.jsonl'
            $vault = Join-Path $root 'data\state.sqlite'
            $registry = Join-Path $root 'storage-locations-v1.json'
            $deadline = (Get-Date).AddSeconds(45)
            $ready = $false
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Desktop exited before native readiness ($($process.ExitCode))" }
              $ready = (Test-Path -LiteralPath $diagnostics) -and
                       (Test-Path -LiteralPath $vault) -and
                       (Test-Path -LiteralPath $registry)
              foreach ($key in $metadataPaths.Keys) {
                if ($null -eq $firstObserved[$key] -and (Test-Path -LiteralPath $metadataPaths[$key])) {
                  $firstObserved[$key] = [int64]$nativeTiming.ElapsedMilliseconds
                }
              }
            } until ($ready -or (Get-Date) -ge $deadline)
            if (-not $ready) {
              throw ('ZYN-BOOT-READY: missing native startup outputs: diagnostics={0}; vault={1}; registry={2}' -f
                (Test-Path -LiteralPath $diagnostics),
                (Test-Path -LiteralPath $vault),
                (Test-Path -LiteralPath $registry))
            }
            $nativeReadyMs = [int64]$nativeTiming.ElapsedMilliseconds
            Write-Output 'Native startup foundations exist; WebView/window visibility still needs independent verification'
            # Keep immutable P01 screenshot evidence untouched. New P02
            # candidates go under an isolated, source-run CI namespace while
            # retaining no-overwrite checks and SHA provenance.
            $proofOutput = Join-Path $env:GITHUB_WORKSPACE 'docs\screenshots\M01'
            if ($env:ZYNOA_CAPTURE_P02 -eq '1') {
              $proofOutput = Join-Path $env:GITHUB_WORKSPACE 'docs\screenshots\_ci\M01'
            }
            if ($env:ZYNOA_CAPTURE_P02 -eq '1') {
              # Probe the real Windows accessibility provider before the
              # screenshot script customizes keyboard bindings in memory.
              $uiaOutput = Join-Path $env:GITHUB_WORKSPACE 'docs\screenshots\_ci\M02\P02-native-uia.capture.json'
              & (Join-Path $env:GITHUB_WORKSPACE 'scripts\probe_p02_native_a11y.ps1') -TargetPid $process.Id -OutputPath $uiaOutput -SourceSha $builtSha
              if ($LASTEXITCODE -ne 0) { throw 'P02 native UIA provider interaction failed' }
            }
            $captureTimer = [System.Diagnostics.Stopwatch]::StartNew()
            & (Join-Path $env:GITHUB_WORKSPACE 'scripts\capture_p01_desktop.ps1') -TargetPid $process.Id -OutputDirectory $proofOutput -SourceSha $env:ZYNOA_HEAD_SHA -BuiltSha $builtSha
            if ($LASTEXITCODE -ne 0) { throw 'ZYN-P02-T10-CAPTURE: native screenshot flow failed' }
            $captureTimer.Stop()
            if ($env:ZYNOA_CAPTURE_P02 -eq '1') {
              $perfDir = Join-Path $env:GITHUB_WORKSPACE 'docs\screenshots\_ci\M02'
              New-Item -ItemType Directory -Force -Path $perfDir | Out-Null
              $sample = [ordered]@{
                schema_version = 1
                source_commit_sha = $builtSha
                target = 'GitHub-hosted Windows Tauri native executable'
                startup_local_metadata_ready_ms = $nativeReadyMs
                process_start_return_ms = $processReturnMs
                metadata_preexisting_before_launch = $metadataPreexisting
                metadata_first_observed_ms = $firstObserved
                timing_breakdown_scope = 'first observation, not initialization duration'
                native_screenshot_suite_ms = [int64]$captureTimer.ElapsedMilliseconds
                measurement = 'single-run observation only'
                performance_budget_approved = $false
                no_user_data = $true
              }
              $sample | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $perfDir 'P02-native-performance.json') -Encoding UTF8
            }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: P02 validate native screenshot SHA, PNG geometry, provenance and candidate status
        if: github.event.pull_request.head.ref == 'phase/02-shared-ui'
        shell: pwsh
        env:
          ZYNOA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m tools.verify_p02_native_evidence --root docs/screenshots/_ci --source-sha $env:ZYNOA_HEAD_SHA --report docs/screenshots/_ci/M02/P02-native-machine-review.json
          if ($LASTEXITCODE -ne 0) { throw "P02 native capture validation failed" }
          python -m tools.verify_p02_t10_readiness --root . --source-sha $env:ZYNOA_HEAD_SHA --report docs/screenshots/_ci/M02/P02-T10-readiness.json
          if ($LASTEXITCODE -ne 0) { throw "P02-T10 truthful readiness audit failed" }
          python -m tools.verify_p02_native_uia --source-sha $env:ZYNOA_HEAD_SHA --proof docs/screenshots/_ci/M02/P02-native-uia.capture.json --report docs/screenshots/_ci/M02/P02-native-uia.verify.json
          if ($LASTEXITCODE -ne 0) { throw "P02 native Windows accessibility audit failed" }
          python -m tools.build_p02_visual_review_pack --root . --source-sha $env:ZYNOA_HEAD_SHA --out docs/screenshots/_ci/M02
          if ($LASTEXITCODE -ne 0) { throw "P02 29-target real Windows review pack audit failed" }
          python -m tools.stage_p02_native_assets --root . --source-sha $env:ZYNOA_HEAD_SHA --out docs/screenshots/_ci/M02
          if ($LASTEXITCODE -ne 0) { throw "P02 exact-path 29-native-image staging ZIP denied by fail-closed reviewer gate" }
      - name: Verify native boot wrote only allowlisted diagnostic metadata
        shell: pwsh
        run: |
          $path = Join-Path $env:LOCALAPPDATA 'com.zynoa.desktop\diagnostics\events-v1.jsonl'
          if (-not (Test-Path -LiteralPath $path)) { throw 'ZYN-DIAG-101: missing real startup record' }
          $lines = @(Get-Content -LiteralPath $path -Encoding utf8)
          if ($lines.Count -lt 1) { throw 'ZYN-DIAG-102: empty spool' }
          $records = @($lines | ForEach-Object { $_ | ConvertFrom-Json })
          if (-not @($records | Where-Object { $_.module -eq 'M01' -and $_.code -eq 'BootReady' }).Count) { throw 'ZYN-DIAG-103: missing boot event' }
          foreach ($record in $records) {
            if ($record.schema_version -ne 1 -or $record.fingerprint.Length -gt 120) { throw 'ZYN-DIAG-104: invalid schema' }
            $keys = @($record.PSObject.Properties.Name)
            $allowed = @('schema_version', 'module', 'severity', 'code', 'fingerprint', 'trace_id', 'first_seen_ms', 'last_seen_ms', 'occurrence_count')
            foreach ($key in $keys) { if ($key -notin $allowed) { throw 'ZYN-DIAG-105: unsafe extra field' } }
          }
          Write-Output 'Native startup diagnostic record validated without exposing raw private data'
      - name: Verify real native vault outside executable after cold boot
        shell: pwsh
        run: |
          $file = Join-Path $env:LOCALAPPDATA 'com.zynoa.desktop\data\state.sqlite'
          if (-not (Test-Path -LiteralPath $file)) { throw 'ZYN-DAT-101: native app vault missing' }
          $env:ZYNOA_CI_VAULT = $file
          @'
          import os
          import sqlite3
          from pathlib import Path
          path = Path(os.environ["ZYNOA_CI_VAULT"])
          assert path.is_file() and path.name == "state.sqlite"
          assert "src-tauri" not in str(path).lower()
          uri = f"file:{path.as_posix()}?mode=ro"
          with sqlite3.connect(uri, uri=True) as db:
              assert db.execute("PRAGMA user_version").fetchone()[0] == 1
              assert db.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              assert db.execute("PRAGMA journal_mode").fetchone()[0].lower() == "wal"
              assert db.execute("SELECT count(*) FROM records").fetchone()[0] == 0
          print("Native app vault schema/integrity verified; no user records created")
          '@ | python -
      - name: Verify local storage ownership registry after real native boot
        shell: pwsh
        run: |
          $file = Join-Path $env:LOCALAPPDATA 'com.zynoa.desktop\storage-locations-v1.json'
          if (-not (Test-Path -LiteralPath $file)) { throw 'ZYN-STO-101: registry missing' }
          $env:ZYNOA_CI_REGISTRY = $file
          @'
          import os, json
          from pathlib import Path
          path = Path(os.environ["ZYNOA_CI_REGISTRY"])
          registry = json.loads(path.read_text(encoding="utf-8"))
          assert registry["schema_version"] == 1
          assert registry["app_id"] == "com.zynoa.desktop"
          keys = {item["kind"]:item for item in registry["locations"]}
          for kind in ("user_vault","diagnostics","backups","cache","download_staging","managed_models"):
              assert keys[kind]["owner"] == "app_managed"
              relative = keys[kind]["relative"]
              assert relative and not Path(relative).is_absolute()
              assert ".." not in Path(relative).parts
              assert keys[kind]["move_allowed"] is False
          assert keys["external_runtime"]["owner"] == "external_read_only"
          assert keys["external_runtime"]["relative"] is None
          assert keys["external_runtime"]["move_allowed"] is False
          print("Native registry safe ownership and no-move defaults verified")
          '@ | python -
      - name: Verify native append-only event DB after real startup
        shell: pwsh
        run: |
          $file = Join-Path $env:LOCALAPPDATA 'com.zynoa.desktop\data\change-events-v1.sqlite'
          if (-not (Test-Path -LiteralPath $file)) { throw 'ZYN-CHG-101: native audit database absent' }
          $env:ZYNOA_CI_EVENTS = $file
          @'
          import os, sqlite3
          from pathlib import Path
          p = Path(os.environ["ZYNOA_CI_EVENTS"])
          assert p.is_file() and "src-tauri" not in str(p).lower()
          uri = f"file:{p.as_posix()}?mode=ro"
          with sqlite3.connect(uri, uri=True) as c:
              assert c.execute("PRAGMA user_version").fetchone()[0] == 1
              assert c.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              assert c.execute("PRAGMA journal_mode").fetchone()[0].lower() == "wal"
              assert c.execute("SELECT count(*) FROM audit_events").fetchone()[0] == 0
              triggers = {t[0] for t in c.execute("SELECT name FROM sqlite_master WHERE type='trigger'")}
              assert {"audit_events_no_update", "audit_events_no_delete"} <= triggers
          print("Private native event ledger verified: WAL, schema, append-only triggers, zero fabricated events")
          '@ | python -
      - name: P02 three real native Windows warm first-visible-window observations
        if: github.event.pull_request.head.ref == 'phase/02-shared-ui'
        shell: pwsh
        env:
          ZYNOA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\src-tauri\target\release\zynoa_desktop.exe'
          $capture = Join-Path $env:GITHUB_WORKSPACE 'docs\screenshots\_ci\M02\P02-native-startup-repeat.capture.json'
          $verified = Join-Path $env:GITHUB_WORKSPACE 'docs\screenshots\_ci\M02\P02-native-startup-repeat.verify.json'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\probe_p02_native_performance.ps1') -Executable $exe -SourceSha $env:ZYNOA_HEAD_SHA -OutputPath $capture
          if ($LASTEXITCODE -ne 0) { throw 'ZYN-PERF-010: actual 3-launch native capture failed' }
          python -m tools.verify_p02_native_performance --source-sha $env:ZYNOA_HEAD_SHA --proof $capture --report $verified
          if ($LASTEXITCODE -ne 0) { throw 'ZYN-PERF-011: actual native timing receipt rejected' }
      - name: P02 enforce preview-only native performance budget
        id: p02_performance_budget
        if: github.event.pull_request.head.ref == 'phase/02-shared-ui'
        shell: pwsh
        env:
          ZYNOA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m tools.verify_p02_t10_performance_budget --budget docs/quality/P02_T10_PERFORMANCE_BUDGET.json --cold docs/screenshots/_ci/M02/P02-native-performance.json --warm docs/screenshots/_ci/M02/P02-native-startup-repeat.verify.json --source-sha $env:ZYNOA_HEAD_SHA --report docs/screenshots/_ci/M02/P02-T10-perf-budget.verify.json
          if ($LASTEXITCODE -ne 0) { throw 'ZYN-PERF-021: evidence did not meet P02 preview Windows budget' }
      - name: P02-T12 separate M26 native keyboard and screenshot candidates
        id: m26_native
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && github.event.pull_request.head.ref == 'phase/02-shared-ui' }}
        shell: pwsh
        env:
          ZYNOA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\src-tauri\target\release\zynoa_desktop.exe'
          $builtSha = (& git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim().ToLowerInvariant()
          if ($builtSha -cne $env:ZYNOA_HEAD_SHA) { throw 'ZYN-M26-007: build SHA mismatch' }
          # Capture M26 before starting either live screen reader. Do not kill
          # unrelated processes; fail if this disposable runner is not isolated.
          if (Get-Process -Name Narrator,nvda -ErrorAction SilentlyContinue) { throw 'ZYN-M26-021: pre-existing screen reader in native capture session' }
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw 'ZYN-M26-008: native process exited' }
            } until ($process.MainWindowHandle -ne [IntPtr]::Zero -or (Get-Date) -ge $deadline)
            if ($process.MainWindowHandle -eq [IntPtr]::Zero) { throw 'ZYN-M26-009: missing native window' }
            $out = Join-Path $env:GITHUB_WORKSPACE 'docs\screenshots\_ci\M26'
            & (Join-Path $env:GITHUB_WORKSPACE 'scripts\capture_p01_desktop.ps1') -TargetPid $process.Id -OutputDirectory $out -SourceSha $env:ZYNOA_HEAD_SHA -BuiltSha $builtSha -M26Only
            python -m tools.verify_p02_m26_candidates --root $out --source-sha $builtSha --run-id $env:GITHUB_RUN_ID
            if ($LASTEXITCODE -ne 0) { throw 'ZYN-M26-010: native candidate receipts rejected' }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            try {
              if (-not $process.WaitForExit(10000)) { throw 'ZYN-M26-022: disposable native capture process did not exit' }
            } finally { $process.Dispose() }
          }
      - name: P02 live NVDA speech plus real Windows keyboard journey (fail closed)
        id: p02_nvda
        if: ${{ !cancelled() && steps.p02_performance_budget.outcome == 'success' && github.event.pull_request.head.ref == 'phase/02-shared-ui' }}
        shell: pwsh
        env:
          ZYNOA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'apps\\desktop\\src-tauri\\target\\release\\zynoa_desktop.exe'
          $capture = Join-Path $env:GITHUB_WORKSPACE 'docs\\screenshots\\_ci\\M02\\P02-nvda-speech.capture.json'
          $report = Join-Path $env:GITHUB_WORKSPACE 'docs\\screenshots\\_ci\\M02\\P02-nvda-speech.verify.json'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\\probe_p02_nvda_speech.ps1') -Executable $exe -SourceSha $env:ZYNOA_HEAD_SHA -OutputPath $capture
          if ($LASTEXITCODE -ne 0) { throw 'ZYN-NVDA-021: real screen reader invocation failed' }
          python -m tools.verify_p02_nvda_speech --proof $capture --source-sha $env:ZYNOA_HEAD_SHA --report $report
          if ($LASTEXITCODE -ne 0) { throw 'ZYN-NVDA-022: live NVDA speech did not prove native labels and focus' }
      - name: P02-T10 exact-source native preview final acceptance
        id: p02_t10_acceptance
        if: ${{ !cancelled() && steps.p02_nvda.outcome == 'success' && github.event.pull_request.head.ref == 'phase/02-shared-ui' }}
        shell: pwsh
        env:
          ZYNOA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ZYNOA_RUN_ID: ${{ github.run_id }}
        run: |
          python -m tools.verify_p02_t10_acceptance --root . --runtime . --source-sha $env:ZYNOA_HEAD_SHA --run-id $env:ZYNOA_RUN_ID --report docs/screenshots/_ci/M02/P02-T10-scoped-acceptance.verify.json
          if ($LASTEXITCODE -ne 0) { throw 'ZYN-P02-T10-021: authentic final preview acceptance failed' }
      - name: P02-T11 live Microsoft Narrator spoken focus and Help journey
        if: ${{ !cancelled() && steps.p02_t10_acceptance.outcome == 'success' && github.event.pull_request.head.ref == 'phase/02-shared-ui' }}
        shell: pwsh
        env:
          ZYNOA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ZYNOA_RUN_ID: ${{ github.run_id }}
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\src-tauri\target\release\zynoa_desktop.exe'
          $capture = Join-Path $env:GITHUB_WORKSPACE 'docs\screenshots\_ci\M02\P02-T11-narrator.capture.json'
          $report = Join-Path $env:GITHUB_WORKSPACE 'docs\screenshots\_ci\M02\P02-T11-narrator.verify.json'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\probe_p02_t11_narrator.ps1'
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$null,[ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw 'ZYN-NAR-PARSE: native Narrator script invalid' }
          & $script -Executable $exe -SourceSha $env:ZYNOA_HEAD_SHA -OutputPath $capture
          python -m tools.verify_p02_t11_narrator --proof $capture --source-sha $env:ZYNOA_HEAD_SHA --run-id $env:ZYNOA_RUN_ID --report $report
          if ($LASTEXITCODE -ne 0) { throw 'ZYN-NAR-022: actual speech receipt rejected' }
      - name: P02-T12 M26 live NVDA tab, search and no-match speech
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && github.event.pull_request.head.ref == 'phase/02-shared-ui' }}
        shell: pwsh
        env:
          ZYNOA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\src-tauri\target\release\zynoa_desktop.exe'
          $capture = Join-Path $env:GITHUB_WORKSPACE 'docs\screenshots\_ci\M26\M26-nvda.capture.json'
          $report = Join-Path $env:GITHUB_WORKSPACE 'docs\screenshots\_ci\M26\M26-nvda.verify.json'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\probe_p02_nvda_speech.ps1') -Executable $exe -SourceSha $env:ZYNOA_HEAD_SHA -OutputPath $capture -M26Only
          $exeHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          python -m tools.verify_p02_nvda_speech --m26 --proof $capture --source-sha $env:ZYNOA_HEAD_SHA --run-id $env:GITHUB_RUN_ID --executable-sha256 $exeHash --report $report
