# REFERENCE TEMPLATE — DO NOT COPY INTO .github/workflows/ UNTIL P11 IMPLEMENTATION.
# Requires actual Tauri app paths, validated pnpm lock, version, signing key, private env approval,
# tested artifact packaging, and matched valid public updater key in app configuration.
# Trigger: release manager creates signed v* tag ONLY after qualification of merged stable commit.
# v3.2 M26 REQUIREMENT: verified ChangeRecords, synchronized Help/Wiki/screenshots, exact release
# manifest version/channel/SHA, generated product CHANGELOG.md + in-app signed feed.
# NOTE: current template intentionally fails before publishing because no app/release system exists.
name: Release Windows (template — qualification required)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # In implementation replace this policy script with CI-attested release qualification;
  # it must compare tag commit, release channel, tests, manifest and data migration evidence.
  release-qualification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Guard — no application yet
        run: |
          echo 'This is a reference template and cannot publish until P11 deployment configuration is complete.'
          exit 1
  build-and-publish:
    needs: release-qualification
    runs-on: windows-latest
    environment: signed-production-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install app dependencies (when repo actually contains app)
        run: npm ci
      - name: Build, sign and attach desktop binaries (P11 implementation)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Workspace ${{ github.ref_name }}'
          releaseBody: 'Verified changelog and support/upgrade notes generated by the qualified release job.'
          releaseDraft: false
          prerelease: false
